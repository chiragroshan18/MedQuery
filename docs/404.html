<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3; url=./">
  <title>Page Not Found — MedQuery Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0f766e;
      --color-primary-hover: #115e59;
      --color-bg: #f8fafc;
      --color-card: #ffffff;
      --color-text: #0f172a;
      --color-muted: #64748b;
      --color-border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0b1120;
        --color-card: #131d33;
        --color-text: #f8fafc;
        --color-muted: #94a3b8;
        --color-border: #1e293b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      background-color: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--color-primary);
      background: rgba(15, 118, 110, 0.12);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.04em;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--color-primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      transition: background 0.2s, transform 0.2s;
    }
    .btn:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <span class="badge">404 • ROUTE REDIRECT</span>
    <h1>Clinical Path Not Found</h1>
    <p>The requested page could not be located. Redirecting you automatically to the MedQuery Healthcare Assistant in 3 seconds...</p>
    <a href="./" class="btn">Return to MedQuery Assistant &rarr;</a>
  </div>
  <script>
    setTimeout(function() {
      window.location.replace('./');
    }, 2500);
  </script>
</body>
</html>
